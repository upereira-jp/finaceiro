# /etc/nginx/sites-available/relatorio-financeiro.blackhaus.io
# Expoe 127.0.0.1:8788 (financeiro-relatorio-mcp) por HTTPS.
#
# O PREFIXO DO NOME NAO IMPORTA AQUI, mas a regra do vhost do financeiro sim:
# o nginx.conf faz include de sites-enabled/* em ordem ALFABETICA e o primeiro
# bloco de cada porta vira o servidor PADRAO. Hoje esse papel e do `intreply`
# (server_name app.blackhaus.io _;) e "relatorio-financeiro" ordena depois de
# "intreply" (r > i), entao nao rouba o padrao. Nao renomeie para algo que
# ordene antes -- e nao declare default_server aqui.
#
# O rate-limit usa a zone `reporting_rl`, ja declarada no http{} por causa do
# conector do CRM. Se aquele vhost sair, a zone tem que continuar existindo.

server {
    listen 80;
    listen [::]:80;
    server_name relatorio-financeiro.blackhaus.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relatorio-financeiro.blackhaus.io;

    ssl_certificate     /etc/letsencrypt/live/relatorio-financeiro.blackhaus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relatorio-financeiro.blackhaus.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2M;   # payload MCP/REST e pequeno

    location / {
        limit_req zone=reporting_rl burst=20 nodelay;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # MCP Streamable HTTP usa SSE: sem buffering, timeout longo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
