# Deploy do financeiro na VPS (root@2.24.203.201) — ESTE WORKFLOW MUTA A PRODUCAO.
#
# Modelo medido pelo recon-vps (regra 10, nada de improviso):
#   - /opt/financeiro/app e um checkout git de github.com/upereira-jp/finaceiro,
#     branch main, working tree limpo. O deploy historico e "git pull no box".
#   - web/dist NAO e versionado (.gitignore tem dist/) — e construido no box com
#     `npm run web:build` (npm --prefix web install && vite build).
#   - servir.ts serve web/dist se existir; o processo escuta 127.0.0.1:3000 e o
#     nginx (financeiro.blackhaus.io, 443/Certbot) faz proxy_pass pra ele.
#   - node bundlado v22 em /opt/financeiro/node; a unit e financeiro.service,
#     User=financeiro. Vizinhos /opt/intre* em :8787/:3001 — VPS COMPARTILHADA,
#     entao o deploy so reinicia financeiro.service, jamais o intre.
#
# O runner do Actions faz o SSH (a porta 22 nao e alcancavel do container do
# assistente; e o mecanismo do ADR-0004 cond. 5). Depende do secret VPS_SSH_KEY.
#
# Deploy ATUAL (16/08): so a logo. ecdddcb..origin/main = 3 commits, SEM migration
# e SEM mudanca de dependencia. Por isso NAO ha prisma migrate deploy aqui: quando
# houver migration pendente, ela entra num passo proprio, com DATABASE_URL vindo
# do ambiente do systemd — fora do escopo deste deploy.
name: deploy-financeiro

on:
  workflow_dispatch:

concurrency:
  group: vps-financeiro          # nunca roda junto com o recon-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: preparar chave ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::secret VPS_SSH_KEY ausente — cadastre a chave privada em Settings > Secrets and variables > Actions"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Mesma logica robusta do recon: aceita chave crua, base64 do arquivo,
          # ou base64 so do corpo do PEM (re-arma). Tolera CRLF do Windows.
          if printf '%s' "$VPS_SSH_KEY" | grep -q 'PRIVATE KEY'; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          else
            DEC=$(mktemp)
            printf '%s' "$VPS_SSH_KEY" | tr -d '\r\n ' | base64 -d > "$DEC" 2>/dev/null || true
            if head -c 14 "$DEC" | grep -q 'openssh-key-v1'; then
              { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; base64 -w70 "$DEC"; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_deploy
            else
              cp "$DEC" ~/.ssh/id_deploy
            fi
            rm -f "$DEC"
          fi
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY nao parseia como chave OpenSSH — rode recon-vps para o diagnostico detalhado."
            exit 1
          fi
          ssh-keyscan -H 2.24.203.201 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: deploy (git ff -> web:build -> restart -> verificar)
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              root@2.24.203.201 'bash -s' <<'REMOTO'
          set -euo pipefail
          APP=/opt/financeiro/app
          UNIT=financeiro.service
          # git sempre como o dono do checkout (financeiro), senao o git recusa por
          # "dubious ownership" e o .git nao vira root.
          g() { runuser -u financeiro -- git -C "$APP" "$@"; }

          echo "===== GUARDAS ====="
          [ -d "$APP/.git" ] || { echo "ERRO: $APP nao e checkout git"; exit 1; }
          URL=$(g remote get-url origin)
          case "$URL" in *upereira-jp/finaceiro*) echo "remote ok: $URL";; *) echo "ERRO: remote inesperado: $URL"; exit 1;; esac
          systemctl cat "$UNIT" >/dev/null 2>&1 || { echo "ERRO: unit $UNIT nao existe"; exit 1; }
          BR=$(g rev-parse --abbrev-ref HEAD)
          [ "$BR" = "main" ] || { echo "ERRO: box nao esta em main (esta em $BR)"; exit 1; }
          if [ -n "$(g status --porcelain)" ]; then
            echo "ERRO: working tree suja em $APP — abortando para nao sobrescrever:"
            g status --porcelain | head; exit 1
          fi

          echo "===== ATUALIZAR (fast-forward) ====="
          OLD=$(g rev-parse --short HEAD)
          g fetch --prune origin main
          g merge --ff-only origin/main
          NEW=$(g rev-parse --short HEAD)
          echo "head: $OLD -> $NEW"
          g log --oneline -1

          echo "===== BUILD DA SPA (regenera web/dist com a logo) ====="
          runuser -u financeiro -- bash -lc "cd '$APP' && npm run web:build"
          test -f "$APP/web/dist/index.html" || { echo "ERRO: web/dist/index.html ausente apos build"; exit 1; }
          echo "web/dist: $(du -sh "$APP/web/dist" | cut -f1)  index.html: $(date -r "$APP/web/dist/index.html" '+%F %T')"

          echo "===== RESTART (somente $UNIT — nunca o intre) ====="
          systemctl restart "$UNIT"
          sleep 2
          systemctl is-active "$UNIT" >/dev/null || { echo "ERRO: $UNIT nao ativo apos restart"; journalctl -u "$UNIT" -n 40 --no-pager; exit 1; }
          echo "$UNIT: $(systemctl is-active "$UNIT")"

          echo "===== VERIFICACAO HTTP local (:3000, aguarda o app subir ate 40s) ====="
          # O app leva ~2-3s pos-restart pra conectar no banco e abrir a porta;
          # is-active fica 'active' antes disso. Por isso poll com retry, nao 1 tiro.
          code=000; tent=0
          for tent in $(seq 1 40); do
            code=$(curl -fsS -o /tmp/fin_check.html -w '%{http_code}' -m 5 http://127.0.0.1:3000/ 2>/dev/null || echo "000")
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code (apos $tent tentativa(s))"
          [ "$code" = "200" ] || { echo "ERRO: app nao respondeu 200 em :3000 apos 40s"; journalctl -u "$UNIT" -n 40 --no-pager; exit 1; }
          echo "primeiros bytes servidos:"; head -c 200 /tmp/fin_check.html; echo
          rm -f /tmp/fin_check.html

          echo "===== DEPLOY OK: $OLD -> $NEW | $UNIT ativo | HTTP 200 ====="
          REMOTO
