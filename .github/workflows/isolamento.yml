# SPEC-001 9 - o teste de isolamento roda no CI desde o primeiro dia.
# ADR-0004 condicao 5: build e teste FORA da maquina de producao.
# Os scripts sao chamados com "bash", nao "./": a interface web do GitHub nao
# preserva o bit de execucao, e este repo ja perdeu o bit duas vezes por isso.
name: isolamento

on:
  push:
    paths: ['prisma/**', 'src/**', 'tests/**', 'spike-transacao/**', 'package.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  migrations-rls-rbac-e-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: cliente psql 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: migrations + suite de isolamento
        env:
          PGPASSWORD: spike
        run: bash tests/run.sh

  vazamento-no-pool:
    # SPEC-001 9: test_vazamento_contexto_no_pool. Pool de tamanho 1, que e onde
    # o SET sem LOCAL aparece. Reusa o spike do ADR-0003 r2.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql 16
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: spike de transacao
        working-directory: spike-transacao
        env:
          PGPASSWORD: spike
        run: bash run.sh

  middleware:
    # SPEC-001 invariantes 10 e 11. E o unico componente onde erro de uma linha
    # vaza dado entre empresas - o teste roda em todo push, sem excecao.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: dependencias
        run: npm install
      # DIRECT_URL com valor DESCARTAVEL, e o motivo esta no job `tipos`: o
      # `generate` nao conecta, mas o prisma.config.ts resolve env('DIRECT_URL')
      # no carregamento e ABORTA se a variavel nao existir. Estes dois scripts
      # chamam `prisma generate` porque `src/generated/` esta no .gitignore -
      # sem a variavel eles morriam em PrismaConfigEnvError antes do primeiro
      # teste, e o job ficava vermelho por configuracao, nao por regressao.
      - name: invariantes do middleware
        env:
          PGPASSWORD: spike
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/middleware.sh
      - name: camada de sessao
        env:
          PGPASSWORD: spike
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/sessao.sh
      - name: documento (CPF e CNPJ, inclusive alfanumerico)
        run: node --experimental-strip-types tests/documento.ts

  tipos:
    # `node --experimental-strip-types` APAGA anotacao de tipo, nao confere. Sem
    # este job os tipos gerados nao valem nada: ate 26/07 o projeto nao tinha
    # NENHUMA verificacao de tipo, e o `db()` de contexto.ts declara
    # [modelo: string]: any - um nome de coluna errado compilava.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: prisma generate (raiz e spike)
        # `generate` NAO conecta, mas o prisma.config.ts resolve env('DIRECT_URL')
        # no carregamento e ABORTA se a variavel nao existir. Valor descartavel.
        env:
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: |
          npx prisma generate
          npx prisma generate --schema=spike-transacao/schema.prisma
      - name: tsc --noEmit
        run: npm run typecheck

  repositorios:
    # Roda por app_financeiro_login, SEM BYPASSRLS: a unica configuracao em que as
    # 24 policies sao avaliadas. Por `postgres` (rolbypassrls = true) daria verde
    # com a RLS desligada, que e o modo de falha que este projeto persegue.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql 16
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: suites de repositorio
        env:
          PGPASSWORD: spike
          # Ver o comentario no job `middleware`: valor descartavel, so para o
          # prisma.config.ts carregar. O `generate` nao conecta.
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/repos.sh
