# SPEC-001 9 - o teste de isolamento roda no CI desde o primeiro dia.
# ADR-0004 condicao 5: build e teste FORA da maquina de producao.
# Os scripts sao chamados com "bash", nao "./": a interface web do GitHub nao
# preserva o bit de execucao, e este repo ja perdeu o bit duas vezes por isso.
name: isolamento

on:
  push:
    # O FILTRO TEM DE COBRIR TUDO O QUE OS JOBS EXECUTAM, e duas vezes em
    # 09/09/2026 ele nao cobria:
    #
    #   `.github/**` e nao `.github/workflows/**` - os cinco jobs dependem de
    #   `.github/instalar-psql.sh`, que nao mora em `workflows/`;
    #
    #   `web/**`, que faltava desde sempre. O job `tipos` roda `npm run test:web`
    #   (1.348 verificacoes) e `tsc -p web --noEmit`, e mesmo assim um commit que
    #   so mexesse em `web/src` ou `web/tests` NAO disparava workflow nenhum.
    #   Medido: o commit `3cc0611`, que acrescentou 15 verificacoes de tela,
    #   passou sem CI. Regressao de tela ficava sem rede ate alguem tocar noutra
    #   pasta por acaso.
    paths:
      - 'prisma/**'
      - 'src/**'
      - 'tests/**'
      - 'web/**'
      - 'spike-transacao/**'
      - 'package.json'
      - '.github/**'
  pull_request:
  workflow_dispatch:

jobs:
  migrations-rls-rbac-e-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # O `apt-get update` mora SO no script, e o motivo esta la dentro: sem
      # restricao ele atualiza tambem as fontes de terceiro da imagem do runner,
      # e em 09/09/2026 o indice do Google Chrome derrubou quatro destes cinco
      # jobs sem que uma linha nossa tivesse mudado.
      - name: cliente psql 16
        run: bash .github/instalar-psql.sh 16
      - name: migrations + suite de isolamento
        env:
          PGPASSWORD: spike
        run: bash tests/run.sh

  vazamento-no-pool:
    # SPEC-001 9: test_vazamento_contexto_no_pool. Pool de tamanho 1, que e onde
    # o SET sem LOCAL aparece. Reusa o spike do ADR-0003 r2.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql 16
        run: bash .github/instalar-psql.sh
      - name: spike de transacao
        working-directory: spike-transacao
        env:
          PGPASSWORD: spike
        run: bash run.sh

  middleware:
    # SPEC-001 invariantes 10 e 11. E o unico componente onde erro de uma linha
    # vaza dado entre empresas - o teste roda em todo push, sem excecao.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql
        run: bash .github/instalar-psql.sh
      - name: dependencias
        run: npm install
      # DIRECT_URL com valor DESCARTAVEL, e o motivo esta no job `tipos`: o
      # `generate` nao conecta, mas o prisma.config.ts resolve env('DIRECT_URL')
      # no carregamento e ABORTA se a variavel nao existir. Estes dois scripts
      # chamam `prisma generate` porque `src/generated/` esta no .gitignore -
      # sem a variavel eles morriam em PrismaConfigEnvError antes do primeiro
      # teste, e o job ficava vermelho por configuracao, nao por regressao.
      - name: invariantes do middleware
        env:
          PGPASSWORD: spike
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/middleware.sh
      - name: camada de sessao
        env:
          PGPASSWORD: spike
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/sessao.sh
      - name: documento (CPF e CNPJ, inclusive alfanumerico)
        run: node --experimental-strip-types tests/documento.ts

  tipos:
    # `node --experimental-strip-types` APAGA anotacao de tipo, nao confere. Sem
    # este job os tipos gerados nao valem nada: ate 26/07 o projeto nao tinha
    # NENHUMA verificacao de tipo, e o `db()` de contexto.ts declara
    # [modelo: string]: any - um nome de coluna errado compilava.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      # AS DEPS DO WEB TAMBEM, e sem elas este job so PARECIA conferir tipo.
      # `npm run typecheck` e `tsc --noEmit && tsc -p web --noEmit`, e o segundo
      # resolve vite, esbuild, react-dom, @phosphor-icons e @supabase/supabase-js
      # a partir de web/package.json - que `npm install` na raiz nao instala.
      # Medido em 01/09/2026: 14 erros TS2307/TS7016, e o job estava vermelho por
      # isso desde que o typecheck passou a incluir o web. Vermelho constante e
      # vermelho ignorado: nenhum tipo foi conferido no CI nesse periodo.
      - run: npm --prefix web install --no-audit --no-fund
      - name: prisma generate (raiz e spike)
        # `generate` NAO conecta, mas o prisma.config.ts resolve env('DIRECT_URL')
        # no carregamento e ABORTA se a variavel nao existir. Valor descartavel.
        env:
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: |
          npx prisma generate
          npx prisma generate --schema=spike-transacao/schema.prisma
      - name: tsc --noEmit
        run: npm run typecheck

      # ======================================================================
      # AS SUITES PURAS RODAM AQUI, e ate 08/09/2026 elas NAO RODAVAM NO CI.
      #
      # Medido em 08/09: de 2.516 verificacoes sem banco, o CI executava
      # `tests/documento.ts` e mais nada — 17. As outras 2.499 nao rodavam em
      # workflow nenhum, e entre elas esta o caminho INTEIRO do primeiro boleto:
      # `linha-digitavel`, `codigo-de-barras`, `brcode`, `qrcode`, `sicoob-http`
      # e `webhook-sicoob`. Uma regressao em qualquer um passava verde em todo
      # push, e o unico sinal seria o primeiro boleto sair errado.
      #
      # MORAM NESTE JOB, e nao num quinto, porque precisam exatamente do que ele
      # ja montou: as deps da raiz, as do `web/` e o `prisma generate` — varias
      # suites importam repositorios, que importam o client gerado. Um job novo
      # repetiria os tres passos para rodar `node`.
      #
      # SAO TRES PASSOS E NAO UM `npm test`: com um passo so, a primeira suite a
      # falhar esconde as outras duas, e o painel do Actions diz "falhou" sem
      # dizer onde. Assim o nome do passo vermelho JA e o diagnostico.
      # ======================================================================
      - name: verificacoes do documento e dos codigos bancarios
        run: npm run test:brcode
      - name: verificacoes das telas
        run: npm run test:web
      - name: verificacoes de dominio
        run: npm run test:dominio

  repositorios:
    # Roda por app_financeiro_login, SEM BYPASSRLS: a unica configuracao em que as
    # 24 policies sao avaliadas. Por `postgres` (rolbypassrls = true) daria verde
    # com a RLS desligada, que e o modo de falha que este projeto persegue.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: spike
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: cliente psql 16
        run: bash .github/instalar-psql.sh
      - name: suites de repositorio
        env:
          PGPASSWORD: spike
          # Ver o comentario no job `middleware`: valor descartavel, so para o
          # prisma.config.ts carregar. O `generate` nao conecta.
          DIRECT_URL: postgresql://ninguem@127.0.0.1:5432/naoconecta
        run: bash tests/repos.sh
